# Two hard-won rules:
#
#   1. `queues:` must be a YAML LIST. Solid Queue does not split
#      "default,rollup" (that's a Sidekiq-ism) and will silently claim nothing.
#   2. Solid Queue has NO queue exclusion, so every queue a job targets must
#      be enumerated here — a job enqueued to a missing queue never runs.
#
# Queues by what they wait on. Ingest is not here at all: it is synchronous
# in the web process and must never depend on the worker.
#
#   default  — small, quick housekeeping.
#   rollup   — metric and profile rollups, partition upkeep, retention. Heavy
#              SQL against the telemetry database, one at a time so two
#              rollups never fight over the same window.
#   monitor  — monitor evaluation, every minute. Its own worker so a long
#              rollup can never delay an alert.
#   fog      — polling fog (roster, vitals, deploys): waits on the network.
#   backup   — fog-backup/2 artifact production, one at a time.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues:
        - default
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues:
        - rollup
      threads: 1
      processes: 1
      polling_interval: 2
    - queues:
        - monitor
        - fog
      threads: 2
      processes: 1
      polling_interval: 2
    - queues:
        - backup
      threads: 1
      processes: 1
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
